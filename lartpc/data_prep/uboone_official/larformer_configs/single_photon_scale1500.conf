# single_photon_scale1500.conf
# Scale-up Stage-A (convert) over 1500 BNB nu overlay files (~10% of the sample),
# WITHOUT signal pre-isolation (isolating signal files barely reduces the count).
# All events are converted; the visible-photon truth cut for Stage B is applied
# downstream on the merged_sp H5 (select_visible_photon_events.py).
#
# Output lives on the larbys data area (the repo fs is ~full; larbys has 56 TB).
# Dataset subfolder, merged_sp/ for Stage-A output and stage3pred/ for Stage-B:
#   /cluster/tufts/wongjiradlab/larbys/data/larformer/mcc9_v29e_dl_run3b_bnb_nu_overlay/{merged_sp,stage3pred}

# Repo paths (defined first so cascade-section vars resolve under set -u).
POINTCEPT_DIR=/cluster/tufts/wongjiradlabnu/twongj01/pointcept_env/pointcept
UBDL_DIR=/cluster/tufts/wongjiradlabnu/twongj01/pointcept_env/ubdl
SP_DIR=${POINTCEPT_DIR}/lartpc/larformer_analysis/physics/single_photon

# ---- Dataset / output ----
DATADIR=/cluster/tufts/wongjiradlab/larbys/data/larformer/mcc9_v29e_dl_run3b_bnb_nu_overlay
INPUTLIST=${SP_DIR}/inputlists/scale1500_bnb_nu_overlay.txt
TAG=sp_bnb_nu_overlay_scale
OUTPUT_DIR=${DATADIR}/merged_sp

# ---- Which lines of INPUTLIST to process ----
#   lineno = OFFSET + stride * SLURM_ARRAY_TASK_ID + i   (i in 1..stride)
#   stride=15 + array=0-99 covers all 1500 files (15 files/task).
stride=15
OFFSET=0

# ---- Conversion flags (older sim: tick-backward, mcc9 truth, wire ADC) ----
ADCNAME=wire
TBFLAG="-tb"
MCC9FLAG="--mcc9"
ISDATAFLAG=""

# ---- Cascade (Stage B): OFF here; run downstream on visible-photon events ----
RUN_CASCADE=0
DEVICE=cuda
CLASS_PROB_THRESHOLD=0.3
LARFORMER_GT_SOURCE=deghost
LARFORMER_CASCADE_CONFIG=${POINTCEPT_DIR}/configs/lartpc/larformer-particle-fullcascade-ptv3crosslevel.py
LARFORMER_PARTICLE_CKPT=${POINTCEPT_DIR}/exp/larformer_particle_v1_cached_ptv3crosslevel_smallbatch_resume3_cosinedecay/model_iter_182304.pth
LARFORMER_DEGHOSTER_CKPT=${POINTCEPT_DIR}/sonata/lora_deghost_v6_hasmatch/model/epoch_30.pth
LARFORMER_SONATA_PRETRAIN=${POINTCEPT_DIR}/sonata/lartpc_v6_h200_noghosts_pretrain_logspace_resume/model/epoch_42.pth
LARFORMER_SLICER_CKPT=${POINTCEPT_DIR}/exp/larformer_slicer_v1_cascaded_ptv3hybrid_crosslevel_nonzeroinit_maskdn_noamp/model/model_ptv3crosslevel_iter_75750.pth

# ---- Containers (Tufts cluster) ----
CONTAINERBIN=apptainer
POINTCEPT_CONTAINER=/cluster/tufts/wongjiradlabnu/larbys/larbys-container/pointcept_cuml.sif
BIND_FOLDERS="/cluster:/cluster"

# ---- Dev / debug knobs ----
WORKDIR_BASE=/tmp
KEEP_INTERMEDIATES=0
MAX_EVENTS=-1
