# extbnb_run3_tufts.conf
# REAL detector data, BEAM-OFF cosmic sample (mcc9 v29e DL run3 G1 EXT-BNB)
# on the Tufts cluster. Provides the cosmic contribution to complete the
# beam-data prediction (paired with the bnb5e19 5e19 POT on-beam sample).
#
# Stage A only (RUN_CASCADE=0): dlmerged -> merged_sp H5; the cascade runs
# downstream with the standard larformer_reco slurm scripts.
#
# Data flags identical to bnb5e19_tufts.conf: --is-data, tick-backward larcv,
# ADC tree "wire". No MC truth anywhere. The 5M-triplet noise veto is on by
# default in the converter.
#
# NOTE: merged_sp output goes to the wongjiradlabNU storage (11 TB free); the
# wongjiradlab larbys area that holds the bnb5e19 merged_sp is ~98% full.

POINTCEPT_DIR=/cluster/tufts/wongjiradlabnu/twongj01/pointcept_env/kpv2_pointcept
UBDL_DIR=/cluster/tufts/wongjiradlabnu/twongj01/pointcept_env/ubdl

# ---- Dataset / output ----
DATADIR=/cluster/tufts/wongjiradlabnu/nutufts/data/larformer/mcc9_v29e_dl_run3_G1_extbnb
INPUTLIST=${POINTCEPT_DIR}/lartpc/data_prep/uboone_official/inputlists/mcc9_v29e_dl_run3_G1_extbnb_dlreco.txt
TAG=extbnb
OUTPUT_DIR=${DATADIR}/merged_sp

# ---- Which lines of INPUTLIST to process ----
stride=1
OFFSET=0

# ---- Conversion flags (real data: tick-backward, is-data, wire ADC) ----
ADCNAME=wire
TBFLAG="-tb"
MCC9FLAG=""
ISDATAFLAG="--is-data"

# ---- Cascade (Stage B): OFF -- run with larformer_reco slurm scripts ----
RUN_CASCADE=0
DEVICE=cuda
CLASS_PROB_THRESHOLD=0.3

# ---- Containers (Tufts cluster) ----
CONTAINERBIN=apptainer
POINTCEPT_CONTAINER=/cluster/tufts/wongjiradlabnu/larbys/larbys-container/pointcept_cuml.sif
BIND_FOLDERS="/cluster:/cluster"

# ---- Dev / debug knobs ----
WORKDIR_BASE=/tmp
KEEP_INTERMEDIATES=0
MAX_EVENTS=-1
