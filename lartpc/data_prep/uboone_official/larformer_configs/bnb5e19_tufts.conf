# bnb5e19_tufts.conf
# REAL detector data (mcc9 v28 wctagger BNB 5e19 POT) on the Tufts cluster.
# Stage A only (RUN_CASCADE=0): dlmerged -> merged_sp H5; the cascade runs
# downstream with the standard larformer_reco slurm scripts.
#
# Data flags: --is-data (SimChTripletLabelMaker data mode: bogus
# mc_particle_tree, per-SP trackid/pid = -1), tick-backward larcv, ADC tree
# "wire". No MC truth anywhere downstream.

POINTCEPT_DIR=/cluster/tufts/wongjiradlabnu/twongj01/pointcept_env/kpv2_pointcept
UBDL_DIR=/cluster/tufts/wongjiradlabnu/twongj01/pointcept_env/ubdl

# ---- Dataset / output ----
DATADIR=/cluster/tufts/wongjiradlab/larbys/data/larformer/mcc9_v28_wctagger_bnb5e19
INPUTLIST=${POINTCEPT_DIR}/lartpc/data_prep/uboone_official/inputlists/mcc9_v28_wctagger_bnb5e19.txt
TAG=bnb5e19
OUTPUT_DIR=${DATADIR}/merged_sp

# ---- Which lines of INPUTLIST to process ----
stride=1
OFFSET=0

# ---- Conversion flags (real data: tick-backward, is-data, wire ADC) ----
ADCNAME=wire
TBFLAG="-tb"
MCC9FLAG=""
ISDATAFLAG="--is-data"

# ---- Cascade (Stage B): OFF -- run with larformer_reco slurm scripts ----
RUN_CASCADE=0
DEVICE=cuda
CLASS_PROB_THRESHOLD=0.3

# ---- Containers (Tufts cluster) ----
CONTAINERBIN=apptainer
POINTCEPT_CONTAINER=/cluster/tufts/wongjiradlabnu/larbys/larbys-container/pointcept_cuml.sif
BIND_FOLDERS="/cluster:/cluster"

# ---- Dev / debug knobs ----
WORKDIR_BASE=/tmp
KEEP_INTERMEDIATES=0
MAX_EVENTS=-1
