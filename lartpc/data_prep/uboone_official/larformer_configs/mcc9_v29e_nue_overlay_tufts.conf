# mcc9_v29e_nue_overlay_tufts.conf
# Official MicroBooNE simulation: mcc9 v29e run3b BNB intrinsic-nue overlay
# (nocrtremerge), on the Tufts cluster. Dedicated CC-nue sample for the
# nue-CC-inclusive selection benchmark.
#
# Stage A only (RUN_CASCADE=0): dlmerged -> merged_sp H5; the cascade + reco
# run downstream with the larformer_reco slurm scripts.
#
# Conversion flags (OLDER official sim, overlay MC): tick-backward larcv,
# --mcc9 truth processing, ADC tree "wire". NOT --is-data (this is MC with
# truth). Same flags as the laptop mcc9_v29e_nue_overlay.conf.
#
# NOTE: merged_sp output goes to wongjiradlabNU storage. As of setup the
# filesystem had ~3.3 TB free (82% used) -- a 1-file smoke was run first to
# size the output before launching the full 3331-file conversion.

POINTCEPT_DIR=/cluster/tufts/wongjiradlabnu/twongj01/pointcept_env/kpv2_pointcept
UBDL_DIR=/cluster/tufts/wongjiradlabnu/twongj01/pointcept_env/ubdl

# ---- Dataset / output ----
DATADIR=/cluster/tufts/wongjiradlabnu/nutufts/data/larformer/mcc9_v29e_dl_run3b_bnb_intrinsic_nue_overlay_nocrtremerge
INPUTLIST=${POINTCEPT_DIR}/lartpc/data_prep/uboone_official/inputlists/mcc9_v29e_dl_run3b_bnb_intrinsic_nue_overlay_nocrtremerge.txt
TAG=mcc9_v29e_nue_overlay
OUTPUT_DIR=${DATADIR}/merged_sp

# ---- Which lines of INPUTLIST to process ----
stride=1
OFFSET=0

# ---- Conversion flags (overlay MC: tick-backward, mcc9 truth, wire ADC) ----
ADCNAME=wire
TBFLAG="-tb"
MCC9FLAG="--mcc9"
ISDATAFLAG=""

# ---- Cascade (Stage B): OFF -- run with larformer_reco slurm scripts ----
RUN_CASCADE=0
DEVICE=cuda
CLASS_PROB_THRESHOLD=0.3

# ---- Containers (Tufts cluster) ----
CONTAINERBIN=apptainer
POINTCEPT_CONTAINER=/cluster/tufts/wongjiradlabnu/larbys/larbys-container/pointcept_cuml.sif
BIND_FOLDERS="/cluster:/cluster"

# ---- Dev / debug knobs ----
WORKDIR_BASE=/tmp
KEEP_INTERMEDIATES=0
MAX_EVENTS=-1
