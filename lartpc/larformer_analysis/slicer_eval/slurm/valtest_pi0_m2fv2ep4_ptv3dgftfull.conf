# valtest conf — m2frecipe-v2 slicer (epoch_4) + NEW PTv3-decoder deghoster.
# Completes the 2x2: {old,new slicer} x {LoRA,PTv3dec deghoster} on the
# pi0filter valtest set. Compare post-deghost completeness vs the LoRA
# baseline column (gamma 0.653) and the hasmatch ceiling (0.815).

WORKDIR=/cluster/tufts/wongjiradlabnu/twongj01/pointcept_env/kpv2_pointcept
CONTAINER=/cluster/tufts/wongjiradlabnu/larbys/containers/pointcept_cuml.sif
TAG=bnb_nu_pi0filter_corsika
MODEL_TAG=m2fv2ep4_ptv3dgftfull

MODEL_CONFIG=${WORKDIR}/configs/lartpc/larformer/stage2_slicer/larformer-slicer-m2frecipe-v2-ptv3deghost-ftfull.py
MODEL_WEIGHTS=${WORKDIR}/exp/larformer_slicer_v1_cascaded_ptv3hybrid_crosslevel_cap300k_m2frecipe_v2/model/epoch_4.pth

RERUN_LINES_FILE=/cluster/tufts/wongjiradlabnu/twongj01/pointcept_env/pointcept/lartpc_data_prep/larformer_analysis/valtest/rerun_lines/bnb_nu_pi0filter_corsika.txt
MANIFEST_CSV=/cluster/tufts/wongjiradlabnu/twongj01/pointcept_env/pointcept/lartpc_data_prep/larformer_analysis/valtest/manifest/bnb_nu_pi0filter_corsika_valtest.csv

OUTPUT_DIR=${WORKDIR}/exp/larformer_slicer_v1_cascaded_ptv3hybrid_crosslevel_cap300k_m2frecipe_v2/valtest_ep4_ptv3dgftfull/

GAMMA_BEAM=1.0
GAMMA_COSMIC=1.0
CHARGE_SOURCE=raw_adc
CHARGE_SHARE_NORM=per-slice

STRIDE=74
SBATCH_GPU_CONSTRAINT="a100"
SBATCH_PARTITION=gpu,preempt
SBATCH_TIME=08:00:00
SBATCH_MEM_PER_CPU=6000
SBATCH_CPUS_PER_TASK=6
SBATCH_LOG_DIR=${WORKDIR}/lartpc/larformer_analysis/slicer_eval/slurm/logs/${TAG}_${MODEL_TAG}
