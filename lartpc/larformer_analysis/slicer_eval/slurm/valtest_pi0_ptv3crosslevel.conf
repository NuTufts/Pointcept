# SLURM val+test driver config — one file per (dataset TAG × model).
# Sourced by submit_valtest.sh; can be edited freely without touching
# the shell wrapper.

# Pointcept repo root on the cluster (must be writeable for the
# valtest output tree, or you can point OUTPUT_DIR elsewhere).
WORKDIR=/cluster/tufts/wongjiradlabnu/twongj01/pointcept_env/pointcept

# Apptainer image used for inference + analysis.
CONTAINER=/cluster/tufts/wongjiradlabnu/larbys/larbys-container/pointcept_cuml.sif

# Dataset TAG (must match the merged-H5 / flashinfo / rerun_lines naming).
TAG=bnb_nu_pi0filter_corsika

# Short identifier embedded in the per-event analysis H5's model_tag attr.
MODEL_TAG=ptv3hybrid_crosslevel_maskdn

# LArFormer model config + checkpoint.
MODEL_CONFIG=${WORKDIR}/configs/lartpc/larformer-slicer-v1-cascaded-ptv3hybrid-crosslevel.py
MODEL_WEIGHTS=${WORKDIR}/exp/larformer_slicer_v1_cascaded_ptv3hybrid_crosslevel_nonzeroinit_maskdn_noamp/model/model_ptv3crosslevel_iter_75750.pth

# Stage-0 outputs (rerun_lines/<TAG>.txt + manifest/<TAG>.csv).
STAGE0_DIR=${WORKDIR}/lartpc/larformer_analysis/slicer_eval/valtest
RERUN_LINES_FILE=${STAGE0_DIR}/rerun_lines/${TAG}.txt
MANIFEST_CSV=${STAGE0_DIR}/manifest/${TAG}_valtest.csv

# Where Stage-2 (inference) + Stage-3 (analysis) outputs go.
# The driver writes:
#   ${OUTPUT_DIR}/inference/<TAG>/slicerpred_*.h5
#   ${OUTPUT_DIR}/analysis/<TAG>/perevent_<run>_<sub>_<evt>.h5
#   ${OUTPUT_DIR}/_inputlists/<TAG>/fileno<N>.txt   (per-task inputlists)
OUTPUT_DIR=${WORKDIR}/exp/larformer_slicer_v1_cascaded_ptv3hybrid_crosslevel_nonzeroinit_maskdn_noamp/valtest_iter_75750/

# Photon-library γ (placeholder — replace with the calibrated value once
# you have one; default 1.0 keeps chi-2 dimensionless / scale-invariant).
GAMMA_BEAM=1.0
GAMMA_COSMIC=1.0

# Per-SP charge for the flash prediction (forwarded to analyze_event).
#   CHARGE_SOURCE=raw_adc      linear Y-plane ADC via merged-H5 join (default)
#                 pre_pixval   legacy log-normalized backbone feature
#   CHARGE_SHARE_NORM=per-slice  divide charge by same-slice pixel-share
#                                count, conserving the 2D footprint integral
#                                (ghost mitigation; default)
#                     none       legacy, no sharing
# Re-tune γ after changing these (pe_pred magnitudes change), and point at a
# fresh OUTPUT_DIR so old perevent_*.h5 don't block regeneration.
CHARGE_SOURCE=raw_adc
CHARGE_SHARE_NORM=per-slice

# Filenos per SLURM array task. Total array size will be
# ceil(N_filenos / STRIDE). Tune this to keep under the cluster's
# AssocMaxSubmitJobLimit. Inference loads the model once per task,
# so larger STRIDE amortizes the load + warm-up cost but lengthens
# the per-task wallclock — adjust SBATCH_TIME below accordingly.
# Example: 1480 filenos / STRIDE=50 → 30 array tasks.
STRIDE=74

# SLURM resource knobs. The script needs 1 GPU + a few CPU cores.
# `--time` should comfortably cover the longest-fileno run; on pi0,
# typical event count per fileno is small (1-10) so 30 min is plenty.
#SBATCH_PARTITION=gpu
#SBATCH_GPU_CONSTRAINT="a100|p100|l40s-48G|h100-80G|h200-141G"
SBATCH_GPU_CONSTRAINT="a100"
SBATCH_PARTITION=batch
SBATCH_TIME=2-00:00:00
SBATCH_MEM_PER_CPU=4000
SBATCH_CPUS_PER_TASK=4

# Log directory (created if missing).
SBATCH_LOG_DIR=${WORKDIR}/lartpc/larformer_analysis/slicer_eval/slurm/logs/${TAG}_${MODEL_TAG}
