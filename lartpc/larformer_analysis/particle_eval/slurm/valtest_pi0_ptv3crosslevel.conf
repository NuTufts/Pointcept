# SLURM val driver config for the LArFormer Stage-3 particle segmenter.
# Sourced by submit_valtest.sh; can be edited freely without touching
# the shell wrapper.

# Pointcept repo root on the cluster (must be writeable for the val
# output tree, or point OUTPUT_DIR elsewhere).
WORKDIR=/cluster/tufts/wongjiradlabnu/twongj01/pointcept_env/pointcept

# Apptainer image used for inference + analysis.
CONTAINER=/cluster/tufts/wongjiradlabnu/larbys/larbys-container/pointcept_cuml.sif

# Dataset TAG (free-form label; embedded in output paths).
TAG=bnb_nu_pi0filter_corsika

# Short identifier embedded in the per-event analysis H5's model_tag attr
# and the aggregator's summary file names.
#MODEL_TAG=larformer_particle_ptv3crosslevel_epoch_3
#MODEL_TAG=larformer_particle_ptv3crosslevel_resume2_iter_87464
#MODEL_TAG=larformer_particle_ptv3crosslevel_resume2_iter_98652
MODEL_TAG=larformer_particle_ptv3crosslevel_resume3_cosinedecay_iter_143278

# LArFormer model config + checkpoint.
#MODEL_CONFIG=${WORKDIR}/configs/lartpc/larformer-particle-v1-cached-ptv3crosslevel.py
MODEL_CONFIG=${WORKDIR}/configs/lartpc/larformer-particle-v1-cached-ptv3crosslevel-p100.py
#MODEL_WEIGHTS=${WORKDIR}/exp/larformer_particle_v1_cached_ptv3crosslevel_smallbatch_lr1e4_bugfixed/epoch_3.pth
#MODEL_WEIGHTS=${WORKDIR}/exp/larformer_particle_v1_cached_ptv3crosslevel_smallbatch_lr1e4_bugfixed_resume2/model_iter_87464.pth
#MODEL_WEIGHTS=${WORKDIR}/exp/larformer_particle_v1_cached_ptv3crosslevel_smallbatch_lr1e4_bugfixed_resume2/model_iter_98652.pth
MODEL_WEIGHTS=${WORKDIR}/exp/larformer_particle_v1_cached_ptv3crosslevel_smallbatch_resume3_cosinedecay/model_iter_143278.pth

# ---- Input source ----
# INPUT_MODE = cached      : iterate Stage-1+2 cache events (matches what
#                            the in-training evaluator sees).
#              full-cascade: iterate raw merged_h5 events (slicer + Stage-3
#                            end-to-end). Slower; useful for real-data eval.
INPUT_MODE=cached

# ---- ANALYSIS MODE ONLY ---
# Sends jobs to the batch queue to avoid using GPU job slots
SKIP_INFERENCE=true
SKIP_ANALYSIS=false

# (cached mode) Root of the Stage-1+2 cache. The driver enumerates
# cache events under ${CACHE_DIR}/${SPLIT}/... and slices by task.
CACHE_DIR=${WORKDIR}/exp/cache_stage12_ptv3crosslevelslicer_iter_75750
SPLIT=val

# (full-cascade mode only) Stage-0 outputs — same shape as the slicer's.
# Ignored when INPUT_MODE=cached.
RERUN_LINES_FILE=${WORKDIR}/lartpc/larformer_analysis/slicer_eval/valtest/rerun_lines/${TAG}.txt
MANIFEST_CSV=${WORKDIR}/lartpc/larformer_analysis/slicer_eval/valtest/manifest/${TAG}_valtest.csv

# Confidence floor for the panoptic-argmax SP assignment in Stage-3
# inference. Matches the model's training-time setting.
CLASS_PROB_THRESHOLD=0.3

# Where outputs go:
#   ${OUTPUT_DIR}/inference/<TAG>/stage3pred_*.h5
#   ${OUTPUT_DIR}/analysis/<TAG>/perevent_*.h5
#   ${OUTPUT_DIR}/_tasklists/<TAG>/task<NNN>.txt
#   ${OUTPUT_DIR}/summary_<TAG>_<MODEL_TAG>.{json,parquet}   (from aggregator)
#OUTPUT_DIR=${WORKDIR}/exp/larformer_particle_v1_cached_ptv3crosslevel_smallbatch_lr1e4_bugfixed/valtest_epoch_3
#OUTPUT_DIR=${WORKDIR}/exp/larformer_particle_v1_cached_ptv3crosslevel_smallbatch_lr1e4_bugfixed_resume2/valtest_iter_87464
#OUTPUT_DIR=${WORKDIR}/exp/larformer_particle_v1_cached_ptv3crosslevel_smallbatch_lr1e4_bugfixed/valtest_iter_98652
OUTPUT_DIR=${WORKDIR}/exp/larformer_particle_v1_cached_ptv3crosslevel_smallbatch_lr1e4_bugfixed/valtest_iter_143278



# Cache events are tiny per-task — big strides are fine. Inference loads
# the model once per task, so larger STRIDE amortizes the load + warmup.
# Example: 4000 val events / STRIDE=200 → 20 array tasks.
#STRIDE=1800
STRIDE=200

# SLURM resource knobs.
#SBATCH_PARTITION=gpu
#SBATCH_GPU_CONSTRAINT="a100"
SBATCH_PARTITION=wongjiradlab
SBATCH_GPU_CONSTRAINT="p100"
SBATCH_TIME=04:00:00
SBATCH_MEM_PER_CPU=4000
SBATCH_CPUS_PER_TASK=4

# Log directory (created if missing).
SBATCH_LOG_DIR=${WORKDIR}/lartpc/larformer_analysis/particle_eval/slurm/logs/${TAG}_${MODEL_TAG}
