# mcc9_v29e_nue_overlay.conf
# OLDER official MicroBooNE simulation (mcc9 v29e run3b BNB intrinsic-nue
# overlay). Used to demonstrate the LArFormer model on official sim.
#
# Distinguishing flags vs the newer sim: tick-backward larcv AND --mcc9 truth
# processing. ADC tree is "wire".

# ---- Dataset / output ----
INPUTLIST=${REPO_ROOT}/inputlists/mcc9_v29e_dl_run3b_bnb_intrinsic_nue_overlay_nocrtremerge_testfile.txt
TAG=mcc9_v29e_nue_overlay
OUTPUT_DIR=/mnt/ddrive/data/mcc9_v29e_dl_run3b_bnb_intrinsic_nue_overlay_nocrtremerge/larformer_h5

# ---- Which lines of INPUTLIST to process ----
stride=1
OFFSET=0

# ---- Conversion flags (older sim: tick-backward, mcc9 truth, wire ADC) ----
ADCNAME=wire
TBFLAG="-tb"
MCC9FLAG="--mcc9"
ISDATAFLAG=""

# ---- Cascade (Stage B) ----
RUN_CASCADE=1
DEVICE=cuda
CLASS_PROB_THRESHOLD=0.3
# LARFORMER_SLICER_CKPT=...   # see NOTE in the cascade config about iter_75750

# ---- Containers ----
CONTAINERBIN=singularity
POINTCEPT_CONTAINER=/mnt/ddrive/containers/pointcept_sandbox/
BIND_FOLDERS="/mnt/ddrive:/mnt/ddrive,/home:/home"
POINTCEPT_DIR=/home/twongjirad/working/larbys/gen2/container_u22/Pointcept
UBDL_DIR=/home/twongjirad/working/larbys/gen2/container_u22/ubdl

# ---- Dev / debug knobs ----
WORKDIR_BASE=/tmp
KEEP_INTERMEDIATES=0
MAX_EVENTS=-1
