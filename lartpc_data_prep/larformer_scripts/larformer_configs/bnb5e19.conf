# bnb5e19.conf
# REAL detector data (mcc9 v28 wctagger BNB 5e19 POT). No MC truth.
#
# Distinguishing flags: --is-data truth processing (SimChTripletLabelMaker in
# data mode), tick-backward larcv, ADC tree "wire". The converter writes a
# (bogus) mc_particle_tree in data mode and per-SP trackid/pid = -1; Stage B
# runs the cascade GT-less so that is harmless.

# ---- Dataset / output ----
INPUTLIST=${REPO_ROOT}/inputlists/bnb5e19_testfile.txt
TAG=bnb5e19
OUTPUT_DIR=/mnt/ddrive/data/mcc9_v28_wctagger_bnb5e19/larformer_h5

# ---- Which lines of INPUTLIST to process ----
stride=1
OFFSET=0

# ---- Conversion flags (real data: tick-backward, is-data, wire ADC) ----
ADCNAME=wire
TBFLAG="-tb"
MCC9FLAG=""
ISDATAFLAG="--is-data"

# ---- Cascade (Stage B) ----
RUN_CASCADE=1
DEVICE=cuda
CLASS_PROB_THRESHOLD=0.3
# LARFORMER_SLICER_CKPT=...   # see NOTE in the cascade config about iter_75750

# ---- Containers ----
CONTAINERBIN=singularity
POINTCEPT_CONTAINER=/mnt/ddrive/containers/pointcept_sandbox/
BIND_FOLDERS="/mnt/ddrive:/mnt/ddrive,/home:/home"
POINTCEPT_DIR=/home/twongjirad/working/larbys/gen2/container_u22/Pointcept
UBDL_DIR=/home/twongjirad/working/larbys/gen2/container_u22/ubdl

# ---- Dev / debug knobs ----
WORKDIR_BASE=/tmp
KEEP_INTERMEDIATES=0
MAX_EVENTS=-1
