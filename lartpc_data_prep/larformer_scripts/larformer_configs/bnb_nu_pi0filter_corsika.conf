# bnb_nu_pi0filter_corsika.conf
# NEWER simulation (BNB nu pi0-filter + corsika overlay) — the sample the
# LArFormer training data was built from.
#
# Sourced by run_larformer_wconfig.sh / run_stepA / run_stepB.
# ${REPO_ROOT} resolves to the larformer_scripts/ directory (set by the
# bootstrap before this file is sourced).

# ---- Dataset / output ----
INPUTLIST=${REPO_ROOT}/inputlists/bnb_nu_pi0filter_corsika_testfile.txt
TAG=bnb_nu_pi0filter_corsika
OUTPUT_DIR=/mnt/ddrive/data/ub_on_tufts/bnb_nu_pi0filter_corsika/larformer_h5

# ---- Which lines of INPUTLIST to process ----
#   lineno = OFFSET + stride * SLURM_ARRAY_TASK_ID + i   (i in 1..stride)
stride=1
OFFSET=0

# ---- Conversion flags (newer sim: tickforward, wiremc ADC, MC truth) ----
ADCNAME=wiremc
TBFLAG=""
MCC9FLAG=""
ISDATAFLAG=""

# ---- Cascade (Stage B) ----
RUN_CASCADE=1
DEVICE=cuda
CLASS_PROB_THRESHOLD=0.3
# Cascade checkpoints — leave unset to use the config defaults baked into
# configs/lartpc/larformer-particle-fullcascade-ptv3crosslevel.py, or override:
# LARFORMER_DEGHOSTER_CKPT=...
# LARFORMER_SLICER_CKPT=...     # see NOTE in the cascade config about iter_75750
# LARFORMER_PARTICLE_CKPT=...
# LARFORMER_SONATA_PRETRAIN=...

# ---- Containers ----
CONTAINERBIN=singularity
POINTCEPT_CONTAINER=/mnt/ddrive/containers/pointcept_sandbox/
BIND_FOLDERS="/mnt/ddrive:/mnt/ddrive,/home:/home"
POINTCEPT_DIR=/home/twongjirad/working/larbys/gen2/container_u22/Pointcept
UBDL_DIR=/home/twongjirad/working/larbys/gen2/container_u22/ubdl

# ---- Dev / debug knobs ----
WORKDIR_BASE=/tmp
KEEP_INTERMEDIATES=0
MAX_EVENTS=-1
