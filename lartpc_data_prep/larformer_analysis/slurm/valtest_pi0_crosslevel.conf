# SLURM val+test driver config — one file per (dataset TAG × model).
# Sourced by submit_valtest.sh; can be edited freely without touching
# the shell wrapper.

# Pointcept repo root on the cluster (must be writeable for the
# valtest output tree, or you can point OUTPUT_DIR elsewhere).
WORKDIR=/cluster/tufts/wongjiradlabnu/twongj01/pointcept_env/pointcept

# Apptainer image used for inference + analysis.
CONTAINER=/cluster/tufts/wongjiradlabnu/larbys/larbys-container/pointcept_cuml.sif

# Dataset TAG (must match the merged-H5 / flashinfo / rerun_lines naming).
TAG=bnb_nu_pi0filter_corsika

# Short identifier embedded in the per-event analysis H5's model_tag attr.
MODEL_TAG=crosslevelrefiner_mixedq_maskdn

# LArFormer model config + checkpoint.
MODEL_CONFIG=${WORKDIR}/configs/lartpc/larformer-slicer-v1-cascaded-crosslevel.py
MODEL_WEIGHTS=${WORKDIR}/exp/larformer_slicer_v1_cascaded_crosslevelrefiner_mixedq_maskdn/model/model_iter_18619.pth

# Stage-0 outputs (rerun_lines/<TAG>.txt + manifest/<TAG>.csv).
STAGE0_DIR=${WORKDIR}/lartpc_data_prep/larformer_analysis/valtest
RERUN_LINES_FILE=${STAGE0_DIR}/rerun_lines/${TAG}.txt
MANIFEST_CSV=${STAGE0_DIR}/manifest/${TAG}.csv

# Where Stage-2 (inference) + Stage-3 (analysis) outputs go.
# The driver writes:
#   ${OUTPUT_DIR}/inference/<TAG>/slicerpred_*.h5
#   ${OUTPUT_DIR}/analysis/<TAG>/perevent_<run>_<sub>_<evt>.h5
#   ${OUTPUT_DIR}/_inputlists/<TAG>/fileno<N>.txt   (per-task inputlists)
OUTPUT_DIR=${WORKDIR}/exp/larformer_slicer_v1_cascaded_crosslevelrefiner_mixedq_maskdn/valtest_iter_18619

# Photon-library γ (placeholder — replace with the calibrated value once
# you have one; default 1.0 keeps chi-2 dimensionless / scale-invariant).
GAMMA_BEAM=1.0
GAMMA_COSMIC=1.0

# SLURM resource knobs. The script needs 1 GPU + a few CPU cores.
# `--time` should comfortably cover the longest-fileno run; on pi0,
# typical event count per fileno is small (1-10) so 30 min is plenty.
SBATCH_PARTITION=wongjiradlab,gpu
SBATCH_GPU_CONSTRAINT="a100|p100|l40s-48G|h100-80G|h200-141G"
SBATCH_TIME=00:30:00
SBATCH_MEM_PER_CPU=4000
SBATCH_CPUS_PER_TASK=4

# Log directory (created if missing).
SBATCH_LOG_DIR=${WORKDIR}/lartpc_data_prep/larformer_analysis/slurm/logs/${TAG}_${MODEL_TAG}
