# configs/onefile_test.conf
# Sourced by scripts/run_showerorigin_reco_wconfig.sh.
# ${REPO_ROOT}, ${UBDL_DIR}, ${POINTCEPT_DIR} are set by the driver before sourcing.

# ---- Dataset / output ----
# Create inputlists/onefile_test.txt with one absolute path to a dlmerged*.root.
INPUTLIST=/cluster/tufts/wongjiradlabnu/twongj01/pointcept_env/pointcept/lartpc_data_prep/inputlists/bnb_nu_corsika_prod2.txt
TAG=bnb_nu_corsika_prod2
OUTPUT_DIR=/cluster/tufts/wongjiradlab/larbys/data/ub_on_tufts/hdf5/v3_larmatch/${TAG}
ROOT_OUTPUT_DIR=${REPO_ROOT}/output/root/v3_larmatch/${TAG}

# ---- Which lines of INPUTLIST to process ----
# lineno = OFFSET + stride * SLURM_ARRAY_TASK_ID + i   (i in 1..stride)
stride=50
OFFSET=0

# ---- Pipeline knobs (rarely changed) ----
ADCNAME=wiremc
TBFLAG=""
MCC9FLAG=""
DEVICE=cuda
LM_MIN_SCORE=0.15

LANTERN_CONTAINER=/cvmfs/uboone.opensciencegrid.org/containers/lantern_v2_me_06_03_prod
POINTCEPT_CONTAINER=/cluster/tufts/wongjiradlabnu/larbys/larbys-container/pointcept_cuml.sif

# SHOWER_ORIGIN_CONFIG=${POINTCEPT_DIR}/configs/lartpc/shower-origin-sonata-v1m1-v3-reco-fragments-p1cmp075.py
# SHOWER_ORIGIN_CKPT=${POINTCEPT_DIR}/shower_origin/sonata_v1m1_v3_v6backbone_p1cmp075_recofragments_logspacefix/model/model_last.pth

# # Merger parameters (defaults match MergerConfig)
# ORIGIN_PROXIMITY_RADIUS=5.0
# CONE_HALF_ANGLE=20.0
# CONE_MAX_LENGTH=300.0
# MIN_POINTS_FRACTION_IN_CONE=0.5

# ---- Dev / debug knobs ----
# WORKDIR_BASE          parent dir for per-file workdirs.
#                       Default /tmp (ephemeral). Point at a persistent path
#                       (e.g. /cluster/tufts/.../scratch) to keep intermediates
#                       across re-runs for stage-by-stage debugging.
# WORKDIR_BASE=/cluster/tufts/wongjiradlabnu/twongj01/pointcept_env/pointcept/lartpc_data_prep/lantern_scripts/tmp_workdir
WORKDIR_BASE=/tmp

# KEEP_INTERMEDIATES    0 or 1. When 1:
#                         - per-file workdir is not wiped on entry/exit
#                         - each pipeline stage is SKIPPED if its canonical
#                           outputs are already present in the workdir
#                         - subscripts skip their own rm cleanup
#                       To force re-run of a specific stage, delete that
#                       stage's output files from the workdir before re-running.
#                       Stage markers:
#                         Step 1:   larmatchme_larlite.root + merged_dlreco_with_ssnet.root
#                         Steps 2-4: merged_<TAG>_fileno*_entry*.h5
#                         Steps 5-7: showerreco_*.root
KEEP_INTERMEDIATES=0

# MAX_EVENTS            int. Passed as --nentries / -n to the Step 1/2/3
#                       Python entrypoints. -1 = all. Step 4 and Steps 5-7
#                       naturally run on whatever per-entry H5 files the
#                       upstream steps produced.
MAX_EVENTS=-1

# SAVE_INFERENCE_H5     0 or 1. When 1, Steps 5-7 also write a per-event
#                       H5 'showerinference_<basename>.h5' containing the raw
#                       per-fragment tensors returned by run_event_inference
#                       (coord, shower_mask, pred_scores, pred_coords,
#                       pred_class_logits, etc.). Useful for downstream
#                       debugging and alternative merger development.
SAVE_INFERENCE_H5=0

# INFERENCE_H5_OUTPUT_DIR  Where the driver copies the per-event inference H5
#                          files to. Defaults to ${OUTPUT_DIR} (same tree as
#                          the merged H5). Override if you want them separate.
# INFERENCE_H5_OUTPUT_DIR=${REPO_ROOT}/output/hdf5/shower_inference/${TAG}
